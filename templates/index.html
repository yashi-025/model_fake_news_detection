<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fake News Detector</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #e0c3fc, #8ec5fc);
            margin: 0;
            padding: 0;
            color: #333;
        }

        h2 {
            text-align: center;
            color: #2d2d2d;
            margin-top: 50px;
            font-size: 2.5rem;
        }

        .form-container {
            max-width: 600px;
            margin: 50px auto;
            background: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        h4 {
            margin-bottom: 15px;
            font-size: 1.25rem;
            color: #555;
        }

        textarea {
            width: 100%;
            margin-bottom: 20px;
            padding: 15px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #8e44ad;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #8e44ad;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #732d91;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <h2>📰 Fake News Detection</h2>
    <div class="form-container">
        <form action="/predict" method="POST">
            <h4>🔤 Enter News Headlines:</h4>
            <textarea name="news_text" rows="6" placeholder="Paste news headline here..." required></textarea>
            <button type="submit">🚀 Detect from Text</button>
        </form>
    </div>
    <div class="footer">
        &copy; 2025 Fake News Detector. Built with ❤️ for truth seekers.
    </div>
</body>
</html>
